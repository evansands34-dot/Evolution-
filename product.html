<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product - Evolution</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header">
    <h1><a href="/">Evolution</a></h1>
    <nav>
      <a href="cart.html" id="cart-link">Cart (0)</a>
    </nav>
  </header>

  <main class="container">
    <a href="/">← Back to products</a>
    <div id="product-detail"></div>

    <section class="reviews" id="reviews-section">
      <h3>Reviews</h3>
      <div id="reviews-list"></div>

      <h4>Add a review</h4>
      <form id="review-form">
        <label>
          Your name<br>
          <input type="text" id="reviewer-name" required>
        </label><br>
        <label>
          Rating<br>
          <select id="review-rating">
            <option value="5">5</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
          </select>
        </label><br>
        <label>
          Comment<br>
          <textarea id="review-comment" rows="3" required></textarea>
        </label><br>
        <button type="submit">Submit review</button>
      </form>
    </section>
  </main>

  <script src="assets/products.js"></script>
  <script src="assets/scripts.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      loadProductPage();
      updateCartCount();

      document.getElementById('review-form').addEventListener('submit', function(e){
        e.preventDefault();
        const id = getQueryParam('id');
        const name = document.getElementById('reviewer-name').value.trim();
        const rating = parseInt(document.getElementById('review-rating').value,10);
        const comment = document.getElementById('review-comment').value.trim();
        if(!name || !comment) return alert('Please add name and comment');
        addReview(id, {name,rating,comment,created: new Date().toISOString()});
        document.getElementById('reviewer-name').value = '';
        document.getElementById('review-comment').value = '';
        renderReviews(id);
      });
    });
  </script>
</body>
</html>
