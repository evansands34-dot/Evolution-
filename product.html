<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Product - Evolution</title>
    <style>
        body{font-family:'Segoe UI',Tahoma,Arial;background:#f8f9fa;color:#2c3e50;padding:20px}
        header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:14px 0;margin-bottom:18px}
        nav{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 20px}
        .logo{font-weight:700;color:#fff;text-decoration:none}
        nav ul{list-style:none;display:flex;gap:18px;align-items:center}
        nav a{color:#fff;text-decoration:none;font-weight:500}
        .container{max-width:900px;margin:0 auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 8px 25px rgba(0,0,0,.06)}
        .top{display:flex;gap:20px;flex-wrap:wrap}
        .img{flex:1 1 320px;height:360px;background:#eee;display:flex;align-items:center;justify-content:center}
        .img img{max-width:100%;max-height:100%;object-fit:cover}
        .details{flex:1 1 260px}
        .price{font-size:28px;color:#667eea;font-weight:700;margin:8px 0}
        .desc{color:#7f8c8d;margin:12px 0}
        .btn{padding:12px 16px;border-radius:8px;border:none;cursor:pointer}
        .addcart{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
        .reviews{margin-top:20px}
        .review{border-top:1px solid #eee;padding:12px 0}
        label{display:block;margin:8px 0 4px}
        input,textarea,select{width:100%;padding:8px;border:1px solid #ddd;border-radius:6px}
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="home.html" class="logo">🔥 Evolution</a>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="shop.html">Products</a></li>
                <li><a href="index.html">Gallery</a></li>
                <li><a href="home.html#contact">Contact</a></li>
            </ul>
            <div>
                <a style="background:#fff;padding:6px 10px;border-radius:18px;color:#333;text-decoration:none" href="cart.html">🛒 Cart (<span id="cartCount">0</span>)</a>
            </div>
        </nav>
    </header>

    <div class="container" id="app">
        <div id="content">Loading...</div>
    </div>

    <script src="products.js"></script>
    <script src="js/evo-ai.js"></script>
    <script>
        function qs(k){
            const params=new URLSearchParams(location.search);return params.get(k);
        }
        const pid = parseInt(qs('id'))||null;
        const product = window.products.find(p=>p.id===pid);
        const content = document.getElementById('content');

        if(!product){
            content.innerHTML = '<p>Product not found.</p>';
        } else {
            content.innerHTML = `
                <div class="top">
                    <div class="img"><img src="${product.image}" alt="${product.name}"></div>
                    <div class="details">
                        <h1>${product.name}</h1>
                        <div class="price">$${product.price.toFixed(2)}</div>
                        <div class="desc">${product.description}</div>
                        <div style="margin-top:12px">
                            <button id="addCartBtn" class="btn addcart">Add to cart</button>
                            <button id="askEvo" class="btn" style="margin-left:8px">Ask Evo AI</button>
                        </div>
                    </div>
                </div>
                <div class="reviews">
                    <h3>Reviews</h3>
                    <div id="reviewsArea">No reviews yet.</div>
                </div>
            `;

            // init Evo AI context
            if(window.setEvoProduct) window.setEvoProduct(product);

            document.getElementById('askEvo').addEventListener('click', ()=>{
                if(window.openEvoAI) window.openEvoAI();
                // Prefill the AI input with a helpful prompt
                setTimeout(()=>{
                    const input = document.getElementById('evoAiInput');
                    if(input) input.value = `Tell me about ${product.name} — ${product.description}`;
                }, 200);
            });

            document.getElementById('addCartBtn').addEventListener('click', ()=>{
                // Simple cart using localStorage
                const cart = JSON.parse(localStorage.getItem('evoCart')||'[]');
                cart.push({id: product.id, name: product.name, price: product.price, image: product.image});
                localStorage.setItem('evoCart', JSON.stringify(cart));
                alert('Added to cart');
                const countEl = document.getElementById('cartCount'); if(countEl) countEl.innerText = cart.length;
            });
        }

        // Update cart count on load
        (function(){ const cart = JSON.parse(localStorage.getItem('evoCart')||'[]'); const countEl = document.getElementById('cartCount'); if(countEl) countEl.innerText = cart.length; })();
    </script>
</body>
</html>
