<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Product - Evolution</title>
    <style>
        body{font-family:'Segoe UI',Tahoma,Arial;background:#f8f9fa;color:#2c3e50;padding:20px}
        .container{max-width:900px;margin:0 auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 8px 25px rgba(0,0,0,.06)}
        .top{display:flex;gap:20px;flex-wrap:wrap}
        .img{flex:1 1 320px;height:360px;background:#eee;display:flex;align-items:center;justify-content:center}
        .img img{max-width:100%;max-height:100%;object-fit:cover}
        .details{flex:1 1 260px}
        .price{font-size:28px;color:#667eea;font-weight:700;margin:8px 0}
        .desc{color:#7f8c8d;margin:12px 0}
        .btn{padding:12px 16px;border-radius:8px;border:none;cursor:pointer}
        .addcart{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
        .reviews{margin-top:20px}
        .review{border-top:1px solid #eee;padding:12px 0}
        label{display:block;margin:8px 0 4px}
        input,textarea,select{width:100%;padding:8px;border:1px solid #ddd;border-radius:6px}
        .back{margin-bottom:12px;display:inline-block}
    </style>
</head>
<body>
    <a class="back" href="shop.html">← Back to Shop</a>
    <div class="container" id="app">
        <div id="content">Loading...</div>
    </div>

    <script src="products.js"></script>
    <script>
        function qs(k){
            const params=new URLSearchParams(location.search);return params.get(k);
        }
        const pid = parseInt(qs('id'))||null;
        const product = window.products.find(p=>p.id===pid);
        const content = document.getElementById('content');
        if(!product){content.innerHTML='<p>Product not found</p>';throw new Error('not found')}

        function getReviews(){try{return JSON.parse(localStorage.getItem('reviews_'+product.id)||'[]')}catch(e){return []}}
        function setReviews(r){localStorage.setItem('reviews_'+product.id,JSON.stringify(r));}

        function render(){
            const reviews = getReviews();
            content.innerHTML = `
                <div class="top">
                    <div class="img"><img src="${product.image}" alt="${product.name}" onerror="this.style.display='none'"></div>
                    <div class="details">
                        <h2>${product.name}</h2>
                        <div class="price">$${product.price.toFixed(2)} <span style="text-decoration:line-through;color:#bdc3c7;font-size:14px;margin-left:8px">$${product.originalPrice.toFixed(2)}</span></div>
                        <div class="desc">${product.description}</div>
                        <div style="margin-top:12px"><button class="btn addcart" onclick="addToCart(${product.id})">Add to cart</button></div>
                        <div style="margin-top:8px;color:#f39c12">${product.rating}</div>
                    </div>
                </div>

                <div class="reviews">
                    <h3>Reviews (${reviews.length})</h3>
                    <div id="reviewsList">
                        ${reviews.map(r=>`<div class="review"><strong>${escapeHtml(r.name)}</strong> <span style="color:#f39c12">${'★'.repeat(r.rating)}</span><div style="color:#555;margin-top:6px">${escapeHtml(r.comment)}</div><div style="font-size:12px;color:#999;margin-top:6px">${new Date(r.date).toLocaleString()}</div></div>`).join('')}
                    </div>

                    <h4 style="margin-top:12px">Add a review</h4>
                    <div>
                        <label for="rname">Name</label>
                        <input id="rname" placeholder="Your name">
                        <label for="rrating">Rating</label>
                        <select id="rrating"><option value="5">5 - Excellent</option><option value="4">4 - Good</option><option value="3">3 - Okay</option><option value="2">2 - Poor</option><option value="1">1 - Terrible</option></select>
                        <label for="rcomment">Comment</label>
                        <textarea id="rcomment" rows="4" placeholder="Write your review"></textarea>
                        <div style="margin-top:8px"><button class="btn" onclick="submitReview()">Submit Review</button></div>
                    </div>
                </div>
            `;
        }

        function escapeHtml(s){return (s||'').toString().replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]})}

        function submitReview(){
            const name = document.getElementById('rname').value.trim()||'Anonymous';
            const rating = parseInt(document.getElementById('rrating').value)||5;
            const comment = document.getElementById('rcomment').value.trim();
            const reviews = getReviews();
            reviews.unshift({name, rating, comment, date: new Date().toISOString()});
            setReviews(reviews);
            document.getElementById('rname').value='';document.getElementById('rcomment').value='';
            render();
        }

        function getCart(){try{return JSON.parse(localStorage.getItem('cart')||'[]')}catch(e){return []}}
        function setCart(c){localStorage.setItem('cart',JSON.stringify(c));}
        function addToCart(id){const cart=getCart();const it=cart.find(i=>i.id===id);if(it){it.quantity+=1}else{cart.push({id,quantity:1})}setCart(cart);alert('Added to cart');}

        render();
    </script>
</body>
</html>
