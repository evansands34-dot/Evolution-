<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolution</title>
</head>
<body>
    <h1>Welcome to Evolution</h1>
    <footer>
        <div>
            Visitor Counter: <span id="visitor-counter">0</span>
        </div>
        <script>
            let count = localStorage.getItem('visitorCount') || 0;
            document.getElementById('visitor-counter').innerText = ++count;
            localStorage.setItem('visitorCount', count);
        </script>
        <br />
        <img src="https://img.shields.io/badge/visitors-{{count}}-blue" alt="Visitor Count Badge" />
    </footer>
</body>
</html>
