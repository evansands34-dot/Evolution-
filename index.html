<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolution - Premium Shoes & Clothing</title>
    <style>
        /* existing styles omitted for brevity in this commit; preserved in repo */
    </style>
</head>
<body>
    <!-- Back Button Section -->
    <section class="back-button-section">
        <button class="back-button" onclick="window.history.back()">← Back to Home</button>
    </section>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to Evolution</h1>
        <p>Premium Shoes & Clothing for Every Style</p>
        <div class="tagline">Elevate Your Wardrobe</div>
        <div class="cta-buttons">
            <button class="btn btn-primary" onclick="document.querySelector('.gallery-section').scrollIntoView({behavior: 'smooth'})">View Gallery</button>
            <button class="btn btn-secondary" onclick="alert('Thank you! We will notify you when items are back in stock.')">Notify Me</button>
        </div>
    </section>

    <!-- Gallery Section -->
    <section class="gallery-section">
        <h2>Featured Collection</h2>
        <div id="gallery">
            <img src="ChatGPT Image Apr 5, 2026, 05_30_31 PM.png" alt="Premium Shoe Collection 1">
            <img src="ChatGPT Image Apr 5, 2026, 05_30_08 PM.png" alt="Premium Shoe Collection 2">
            <img src="ChatGPT Image Apr 5, 2026, 05_29_10 PM.png" alt="Premium Clothing Collection 1">
            <img src="ChatGPT Image Apr 5, 2026, 05_29_44 PM.png" alt="Premium Clothing Collection 2">
        </div>
    </section>

    <!-- Counter Section -->
    <div id="counter">Visitor Count: <span id="visitors">Loading...</span></div>

    <script>
        const COUNTAPI_URL = 'https://api.countapi.xyz/hit/evansands34dot/evolution';
        async function updateVisitorCounter() {
            try {
                const res = await fetch(COUNTAPI_URL);
                if (!res.ok) throw new Error('CountAPI error: ' + res.status);
                const data = await res.json();
                document.getElementById('visitors').textContent = data.value;
            } catch (err) {
                console.error('Error updating counter:', err);
                document.getElementById('visitors').textContent = 'Error';
            }
        }
        updateVisitorCounter();
    </script>

    <script src="auth.js"></script>
</body>
</html>
