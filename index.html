<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolution Brand</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #222;
        }
        header {
            background-color: #111;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }
        header p {
            margin: 5px 0 0 0;
            font-size: 1rem;
            color: #ccc;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 40px 20px;
        }
        .gallery img {
            width: 300px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.35);
        }
        footer {
            text-align: center;
            padding: 20px 0;
            background-color: #111;
            color: #ccc;
            margin-top: 40px;
        }
        footer span {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <h1>Evolution</h1>
        <p>Your Sneaker & Outfit Collection</p>
    </header>

    <section class="gallery">
        <img src="https://raw.githubusercontent.com/evansands34-dot/Evolution-/main/1%20Screen%20shot%20_20250622_191824_Chrome.jpg" alt="Screenshot 1">
        <img src="https://raw.githubusercontent.com/evansands34-dot/Evolution-/main/2%20screen%20shot%20Screenshot%20_20250622_182351_Chrome.jpg" alt="Screenshot 2">
        <img src="https://raw.githubusercontent.com/evansands34-dot/Evolution-/main/3%20screen%20shot%20Screenshot_20250621_121558_Chrome.jpg" alt="Screenshot 3">
        <img src="https://raw.githubusercontent.com/evansands34-dot/Evolution-/main/4%20screen%20shot%20Screenshot_20250621_121558_Chrome.jpg" alt="Screenshot 4">
    </section>

    <footer>
        Visitor Counter: <span id="visitor-counter">0</span>
        <script>
            let count = localStorage.getItem('visitorCount') || 0;
            document.getElementById('visitor-counter').innerText = ++count;
            localStorage.setItem('visitorCount', count);
        </script>
    </footer>
</body>
</html>
