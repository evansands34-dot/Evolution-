<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolution - Premium Shoes & Clothing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: white;
            text-align: center;
            padding: 80px 20px;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 1.5em;
            margin-bottom: 15px;
            font-weight: 300;
            opacity: 0.9;
        }

        .tagline {
            font-size: 1.2em;
            color: #b8a883;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .cta-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            padding: 14px 40px;
            font-size: 1.1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background-color: #b8a883;
            color: #1a1a1a;
        }

        .btn-primary:hover {
            background-color: #d4c5a9;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(184, 168, 131, 0.3);
        }

        .btn-secondary {
            background-color: transparent;
            color: white;
            border: 2px solid #b8a883;
        }

        .btn-secondary:hover {
            background-color: #b8a883;
            color: #1a1a1a;
            transform: translateY(-2px);
        }

        /* Gallery Section */
        .gallery-section {
            padding: 60px 20px;
            background-color: #f5f5f5;
        }

        .gallery-section h2 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 50px;
            color: #1a1a1a;
        }

        #gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
        }

        #gallery img {
            width: 280px;
            height: 280px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        #gallery img:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        /* Counter Section */
        #counter {
            text-align: center;
            font-size: 1.3em;
            padding: 40px 20px;
            background-color: #f5f5f5;
            color: #666;
        }

        #counter span {
            font-weight: 700;
            color: #b8a883;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5em;
            }

            .hero p {
                font-size: 1.2em;
            }

            .cta-buttons {
                flex-direction: column;
                gap: 15px;
            }

            .btn {
                width: 100%;
                max-width: 300px;
            }

            #gallery {
                flex-direction: column;
                align-items: center;
            }

            #gallery img {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to Evolution</h1>
        <p>Premium Shoes & Clothing for Every Style</p>
        <div class="tagline">Elevate Your Wardrobe</div>
        <div class="cta-buttons">
            <button class="btn btn-primary" onclick="document.querySelector('.gallery-section').scrollIntoView({behavior: 'smooth'})">View Gallery</button>
            <button class="btn btn-secondary" onclick="alert('Thank you! We will notify you when items are back in stock.')">Notify Me</button>
        </div>
    </section>

    <!-- Gallery Section -->
    <section class="gallery-section">
        <h2>Featured Collection</h2>
        <div id="gallery">
            <img src="ChatGPT Image Apr 5, 2026, 05_30_31 PM.png" alt="Premium Shoe Collection 1">
            <img src="ChatGPT Image Apr 5, 2026, 05_30_08 PM.png" alt="Premium Shoe Collection 2">
            <img src="ChatGPT Image Apr 5, 2026, 05_29_10 PM.png" alt="Premium Clothing Collection 1">
            <img src="ChatGPT Image Apr 5, 2026, 05_29_44 PM.png" alt="Premium Clothing Collection 2">
        </div>
    </section>

    <!-- Counter Section -->
    <div id="counter">Visitor Count: <span id="visitors">0</span></div>

    <script>
        // === ALL-TIME VISITOR COUNTER (FIXED) ===
        const BIN_URL = "https://api.jsonbin.io/v3/b/69d2e2a236566621a880f38b";
        const API_KEY = "$2a$10$9AJ7g6bJDa5Tf40aUdHad.w7rr16pMi89Mj52JoygN1v33irInCwC";
        let counterUpdated = false;

        async function updateVisitorCounter() {
            try {
                // 1. Get current visitor count from JSONBin
                const res = await fetch(BIN_URL, {
                    headers: { "X-Master-Key": API_KEY }
                });
                const data = await res.json();
                let count = data.record.visitorCount || 0;

                // 2. Only increment if we haven't already updated this session
                if (!counterUpdated) {
                    count++;
                    counterUpdated = true;

                    // 3. Update the JSONBin record
                    await fetch(BIN_URL, {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json",
                            "X-Master-Key": API_KEY
                        },
                        body: JSON.stringify({ visitorCount: count })
                    });
                }

                // 4. ALWAYS display the INCREMENTED count
                document.getElementById('visitors').textContent = count;
                console.log("Visitor count:", count);
            } catch (err) {
                console.error("Error updating counter:", err);
                document.getElementById('visitors').textContent = "Error";
            }
        }

        // Run the counter update
        updateVisitorCounter();
    </script>
</body>
</html>
