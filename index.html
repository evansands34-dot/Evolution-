<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evolution Gallery</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f5f5f5;
        margin: 0;
        padding: 0;
    }
    h1 {
        margin: 20px 0;
    }
    #gallery {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        margin: 20px 0;
    }
    #gallery img {
        width: 300px;
        margin: 10px;
        border: 2px solid #ccc;
        border-radius: 10px;
    }
    #counter {
        font-size: 20px;
        margin: 20px 0;
    }
</style>
</head>
<body>
<h1>Welcome to Evolution Gallery</h1>

<div id="gallery">
    <img src="ChatGPT Image Apr 5, 2026, 05_30_31 PM.png" alt="Image 1">
    <img src="ChatGPT Image Apr 5, 2026, 05_30_08 PM.png" alt="Image 2">
    <img src="ChatGPT Image Apr 5, 2026, 05_29_10 PM.png" alt="Image 3">
    <img src="ChatGPT Image Apr 5, 2026, 05_29_44 PM.png" alt="Image 4">
</div>

<div id="counter">Visitor Count: <span id="visitors">0</span></div>

<script>
// === GLOBAL VISITOR COUNTER USING JSONBIN ===
const BIN_URL = "https://api.jsonbin.io/v3/b/69d2e2a236566621a880f38b";
const API_KEY = "$2a$10$9AJ7g6bJDa5Tf40aUdHad.w7rr16pMi89Mj52JoygN1v33irInCwC";

async function updateVisitorCounter() {
    try {
        // 1. Get current visitor count from JSONBin
        const res = await fetch(BIN_URL, {
            headers: { "X-Master-Key": API_KEY }
        });
        const data = await res.json();
        let count = data.record.visitorCount || 0;

        // 2. Increase the counter by 1
        count++;

        // 3. Update the JSONBin record
        await fetch(BIN_URL, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "X-Master-Key": API_KEY
            },
            body: JSON.stringify({ visitorCount: count })
        });

        // 4. Show the count on your page
        document.getElementById('visitors').textContent = count;
    } catch (err) {
        console.error("Error updating counter:", err);
        document.getElementById('visitors').textContent = "Error";
    }
}

// Run the counter update
updateVisitorCounter();
</script>
</body>
</html>
