<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolution Brand</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 20px; background: #f8f8f8; }
        h1 { color: #222; }
        h2 { margin-top: 40px; color: #555; }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        .gallery img { width: 250px; height: auto; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); transition: transform 0.2s; }
        .gallery img:hover { transform: scale(1.05); }
        footer { margin-top: 40px; color: #666; }
    </style>
</head>
<body>
    <h1>Welcome to Evolution</h1>
    <h2>Evolution Collection</h2>

    <div class="gallery">
    <img src="RAW_URL_1" alt="Sneaker 1">
    <img src="RAW_URL_2" alt="Sneaker 2">
    <img src="RAW_URL_3" alt="Outfit 1">
    <img src="RAW_URL_4" alt="Outfit 2">
    </div>

    <footer>
        <div>
            Visitor Counter: <span id="visitor-counter">0</span>
        </div>
        <script>
            let count = localStorage.getItem('visitorCount') || 0;
            document.getElementById('visitor-counter').innerText = ++count;
            localStorage.setItem('visitorCount', count);
        </script>
    </footer>
</body>
</html>
