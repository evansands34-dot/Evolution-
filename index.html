<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
        }
        img {
            width: 300px;
            margin: 10px;
            border: 2px solid #ccc;
            border-radius: 10px;
        }
        #counter {
            font-size: 20px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Gallery</h1>
    
    <div id="gallery">
        <img src="ChatGPT Image Apr 5, 2026, 05_30_31 PM.png" alt="Image 1">
        <img src="ChatGPT Image Apr 5, 2026, 05_30_08 PM.png" alt="Image 2">
        <img src="ChatGPT Image Apr 5, 2026, 05_29_10 PM.png" alt="Image 3">
        <img src="ChatGPT Image Apr 5, 2026, 05_29_44 PM.png" alt="Image 4">
    </div>

    <div id="counter">Visitor Count: <span id="visitors">0</span></div>

    <script>
        // Check if a visitor count exists in localStorage
        let visitors = localStorage.getItem('visitorCount');
        if (!visitors) {
            visitors = 0;
        } else {
            visitors = parseInt(visitors);
        }

        // Increase the visitor count by 1
        visitors++;
        localStorage.setItem('visitorCount', visitors);

        // Display the visitor count
        document.getElementById('visitors').textContent = visitors;
    </script>
</body>
</html>
