<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cart - Evolution</title>
<style>/* existing styles */</style>
</head>
<body>
<header>
    <nav>
        <a href="home.html" class="logo">Evolution</a>
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="shop.html">Products</a></li>
            <li><a href="index.html">Gallery</a></li>
            <li><a href="home.html#contact">Contact</a></li>
        </ul>
        <div>
            <a style="background:#fff;padding:6px 10px;border-radius:18px;color:#333;text-decoration:none" href="cart.html">🛒 Cart (<span id="cartCount">0</span>)</a>
        </div>
    </nav>
</header>

<div class="wrap">
    <h1>🛒 Your Cart</h1>
    <div class="grid">
        <div>
            <div class="card" id="cartArea">Loading cart...</div>
        </div>
        <div>
            <div class="card">
                <h3>Checkout</h3>
                <div style="margin:8px 0">
                    <label>Name</label>
                    <input id="cname" placeholder="Full name" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px">
                </div>
                <div style="margin:8px 0">
                    <label>Address</label>
                    <input id="caddr" placeholder="Shipping address" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px">
                </div>
                <div style="margin:8px 0">
                    <label>Payment (mock)</label>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="auth.js"></script>
</body>
</html>
