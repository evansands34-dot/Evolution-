    <script src="js/header.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/supabase.js"></script>
    <script>
        function renderCart(){
            const area = document.getElementById('cartArea');
            const cart = JSON.parse(localStorage.getItem('evoCart')||'[]');
            if(cart.length===0){ area.innerHTML = '<p>Your cart is empty.</p>'; return; }
            area.innerHTML = '';
            cart.forEach((it, idx)=>{
                const div = document.createElement('div'); div.className='item';
                div.innerHTML = `
                    <img src="${it.image}" alt="${it.name}">
                    <div style="flex:1">
                      <div style="font-weight:700">${it.name}</div>
                      <div>$${it.price.toFixed(2)}</div>
                    </div>
                    <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">
                      <button data-idx="${idx}" class="removeBtn">Remove</button>
                    </div>
                `;
                area.appendChild(div);
            });
            document.querySelectorAll('.removeBtn').forEach(b=>b.addEventListener('click', (e)=>{ const i=parseInt(e.target.dataset.idx); const c=JSON.parse(localStorage.getItem('evoCart')||'[]'); c.splice(i,1); localStorage.setItem('evoCart', JSON.stringify(c)); renderCart(); }));
        }
        document.addEventListener('DOMContentLoaded', ()=>{ renderCart(); document.getElementById('checkoutBtn').addEventListener('click', async ()=>{ 
            const name = document.getElementById('cname').value.trim();
            const addr = document.getElementById('caddr').value.trim();
            const cart = JSON.parse(localStorage.getItem('evoCart')||'[]');
            if(cart.length===0){ alert('Cart is empty'); return; }
            const total = cart.reduce((s,i)=>s+(i.price||0),0);
            const session = window.evoAuth && window.evoAuth.getSession ? window.evoAuth.getSession() : null;
            const purchase = { user: session, items: cart, total, address: addr || null };
            try{
                if(window.evoSupabase){
                    await window.evoSupabase.submitPurchase(purchase);
                    alert('Purchase submitted');
                    localStorage.removeItem('evoCart'); renderCart();
                } else {
                    const key = 'evoPurchasesLocal'; const arr = JSON.parse(localStorage.getItem(key)||'[]'); arr.unshift(Object.assign({ id: Date.now(), created_at: new Date().toISOString() }, purchase)); localStorage.setItem(key, JSON.stringify(arr)); alert('Purchase saved locally (demo)'); localStorage.removeItem('evoCart'); renderCart();
                }
            }catch(err){ alert('Checkout failed'); console.error(err); }
         }); });
    </script>
</body>
</html>
