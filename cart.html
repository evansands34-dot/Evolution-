<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cart & Checkout - Evolution</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header">
    <h1><a href="/">Evolution</a></h1>
    <nav class="top-nav">
      <a href="gallery.html" class="nav-link">Gallery</a>
      <a href="index.html" class="nav-link nav-active">Shopping</a>
      <a href="cart.html" id="cart-link" class="cart-link" aria-label="Cart"></a>
    </nav>
  </header>

  <main class="container">
    <h2>Your Cart</h2>
    <div id="cart-contents"></div>

    <section class="checkout">
      <h3>Checkout</h3>
      <form id="checkout-form">
        <label>
          Full name<br>
          <input type="text" id="fullname" required>
        </label><br>
        <label>
          Address<br>
          <input type="text" id="address" required>
        </label><br>
        <label>
          Card number (demo only)<br>
          <input type="text" id="card" required>
        </label><br>
        <button type="submit" class="btn">Place Order</button>
      </form>
      <div id="order-result" class="order-result"></div>
    </section>
  </main>

  <script src="assets/products.js"></script>
  <script src="assets/scripts.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      renderCartPage();
      updateCartCount();

      document.getElementById('checkout-form').addEventListener('submit', function(e){
        e.preventDefault();
        const cart = getCart();
        if(!cart || cart.length === 0) return alert('Your cart is empty');
        const fullname = document.getElementById('fullname').value.trim();
        const address = document.getElementById('address').value.trim();
        const card = document.getElementById('card').value.trim();
        if(!fullname || !address || !card) return alert('Please fill all fields');
        const total = cart.reduce((s,item)=> s + item.qty * Number(item.price),0).toFixed(2);
        const order = {
          id: 'ORD-' + Date.now(),
          name: fullname,
          address,
          total,
          items: cart,
          placedAt: new Date().toISOString()
        };
        localStorage.removeItem('evo_cart');
        renderCartPage();
        updateCartCount();
        document.getElementById('order-result').innerHTML = `<div class="order-confirm">Order placed!<br>Order ID: ${order.id}<br>Total: $${order.total}</div>`;
      });
    });
  </script>
</body>
</html>
