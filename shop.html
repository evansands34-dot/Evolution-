<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Evolution Premium Shoes & Clothing</title>
    <style>
        /* Keep original styles but shorten for brevity */
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',Tahoma,Geneva, Verdana, sans-serif;background:#f8f9fa;color:#2c3e50}
        header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:18px 0}
        nav{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 20px}
        .logo{font-weight:700;color:#fff;text-decoration:none}
        nav ul{list-style:none;display:flex;gap:22px;align-items:center}
        nav a{color:#fff;text-decoration:none;font-weight:500}
        .container{max-width:1200px;margin:20px auto;padding:0 20px}
        .page-header{text-align:center;padding:40px 20px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border-radius:8px}
        .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:30px;margin-top:30px}
        .product-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,.08);border:1px solid #ecf0f1}
        .product-image{height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
        .product-image img{width:100%;height:100%;object-fit:cover}
        .product-info{padding:18px}
        .product-name{font-size:18px;font-weight:700;margin:8px 0;color:#2c3e50}
        .product-price{font-size:20px;font-weight:700;color:#667eea}
        .product-rating{color:#f39c12;margin-top:8px}
        .add-to-cart-btn{padding:12px;border-radius:8px;border:none;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;cursor:pointer;width:100%;font-weight:600}
        .filter-section{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px}
        .filter-btn{padding:10px 18px;border-radius:20px;border:2px solid #667eea;background:#fff;color:#667eea;cursor:pointer}
        .filter-btn.active{background:#667eea;color:#fff}
        @media(max-width:600px){.products-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
        .cart-link{background:#fff;padding:8px 12px;border-radius:20px;color:#333}
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="home.html" class="logo">🔥 Evolution</a>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="shop.html" class="nav-active">Products</a></li>
                <li><a href="index.html">Gallery</a></li>
                <li><a href="home.html#contact">Contact</a></li>
            </ul>
            <div>
                <a class="cart-link" href="cart.html">🛒 Cart (<span id="cartCount">0</span>)</a>
            </div>
        </nav>
    </header>

    <section class="page-header">
        <h1>🛍️ Evolution Products</h1>
        <p>Premium Shoes & Clothing - Click a product to view details, reviews, and checkout</p>
    </section>

    <div class="container">
        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All Items</button>
            <button class="filter-btn" data-filter="footwear">👟 Footwear</button>
            <button class="filter-btn" data-filter="apparel">👕 Apparel</button>
        </div>

        <div class="products-grid" id="productsGrid"></div>
    </div>

    <script src="products.js"></script>
    <script>
        // simple cart in localStorage: [{id,quantity}]
        function getCart(){try{return JSON.parse(localStorage.getItem('cart')||'[]')}catch(e){return []}}
        function setCart(c){localStorage.setItem('cart',JSON.stringify(c));updateCartCount();}
        function updateCartCount(){const count=getCart().reduce((s,it)=>s+it.quantity,0);const el=document.getElementById('cartCount');if(el)el.textContent=count}

        function addToCart(id){const cart=getCart();const existing=cart.find(i=>i.id===id);if(existing){existing.quantity+=1}else{cart.push({id,quantity:1})}setCart(cart);alert('Added to cart')}

        function renderProducts(filter='all'){
            const grid=document.getElementById('productsGrid');grid.innerHTML='';
            const list = filter==='all'?window.products:window.products.filter(p=>p.category===filter);
            list.forEach(p=>{
                const card=document.createElement('div');card.className='product-card';
                card.innerHTML = `
                    <a href="product.html?id=${encodeURIComponent(p.id)}" style="text-decoration:none;color:inherit">
                      <div class="product-image"><img src="${p.image}" alt="${p.name}" onerror="this.style.display='none'"></div>
                    </a>
                    <div class="product-info">
                        <a href="product.html?id=${encodeURIComponent(p.id)}" style="text-decoration:none;color:inherit"><div class="product-name">${p.name}</div></a>
                        <div class="product-price">$${p.price.toFixed(2)}</div>
                        <div class="product-rating">${p.rating}</div>
                        <div style="margin-top:12px"><button class="add-to-cart-btn" onclick="addToCart(${p.id})">Add to Cart</button></div>
                    </div>
                `;
                grid.appendChild(card);
            })
        }

        document.querySelectorAll('.filter-btn').forEach(btn=>{
            btn.addEventListener('click',()=>{
                document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                renderProducts(btn.dataset.filter);
            })
        })

        // initial
        renderProducts();updateCartCount();
    </script>
</body>
</html>
