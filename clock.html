<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Digital Clock</title>\n    <style>\n        body {\n            font-family: Arial, sans-serif;\n            display: flex;\n            justify-content: center;\n            margin: 0;\n            padding: 50px;\n            background-color: #f0f0f0;\n        }\n        .clock {\n            background: #fff;\n            padding: 20px;\n            border-radius: 10px;\n            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);\n        }\n        h2 {\n            margin: 10px 0;\n        }\n    </style>\n</head>\n<body>\n    <div class="clock">\n        <h2>Digital Clock</h2>\n        <div id="clocks">\n            <div id="est">EST: <span class="time"></span></div>\n            <div id="cst">CST: <span class="time"></span></div>\n            <div id="mst">MST: <span class="time"></span></div>\n            <div id="pst">PST: <span class="time"></span></div>\n            <div id="utc">UTC: <span class="time"></span></div>\n        </div>\n    </div>\n    <script>\n        function updateClocks() {\n            const now = new Date();\n            const options = { hour: '2-digit', minute: '2-digit', second: '2-digit' };\n            document.getElementById('est').querySelector('.time').textContent = now.toLocaleTimeString('en-US', { timeZone: 'America/New_York', ...options });\n            document.getElementById('cst').querySelector('.time').textContent = now.toLocaleTimeString('en-US', { timeZone: 'America/Chicago', ...options });\n            document.getElementById('mst').querySelector('.time').textContent = now.toLocaleTimeString('en-US', { timeZone: 'America/Denver', ...options });\n            document.getElementById('pst').querySelector('.time').textContent = now.toLocaleTimeString('en-US', { timeZone: 'America/Los_Angeles', ...options });\n            document.getElementById('utc').querySelector('.time').textContent = now.toISOString().substr(11, 8);\n        }\n        setInterval(updateClocks, 1000);\n        updateClocks();\n    <\/script>\n</body>\n</html>
