<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evolution</title>

<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:Arial;}

body {
    background:#0f172a;
    color:white;
}

/* === ENTRY SCREEN === */
#intro {
    position:fixed;
    inset:0;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:9999;
    animation: fadeOut 1s ease 2.5s forwards;
}

#intro h1 {
    font-size:40px;
    letter-spacing:2px;
}

#intro p {
    margin-top:10px;
    color:#94a3b8;
}

@keyframes fadeOut {
    to {opacity:0; visibility:hidden;}
}

/* === MAIN PAGE === */
header {
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#111827;
}

.logo {
    font-size:20px;
    font-weight:bold;
    color:#60a5fa;
}

nav a {
    color:white;
    margin-left:15px;
    text-decoration:none;
}

/* HERO */
.hero {
    height:80vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    background: linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
    url('ChatGPT Image Apr 5, 2026, 05_30_31 PM.png');
    background-size:cover;
    background-position:center;
}

.hero h2 {
    font-size:45px;
}

.hero span {
    color:#60a5fa;
}

/* BUTTON */
.btn {
    margin-top:15px;
    padding:12px 22px;
    background:#60a5fa;
    border:none;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

/* SECTIONS */
.section {
    padding:60px 20px;
    text-align:center;
}

.cards {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:20px;
}

.card {
    background:#1e293b;
    padding:20px;
    border-radius:10px;
    cursor:pointer;
}

/* MODAL */
.modal {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
}

.modal.active {display:flex;}

.modal-box {
    background:white;
    color:black;
    padding:20px;
    border-radius:10px;
}

/* FOOTER */
footer {
    padding:20px;
    text-align:center;
    background:#111827;
    margin-top:40px;
}
</style>
</head>

<body>

<!-- INTRO SCREEN -->
<div id="intro">
    <h1>Evolution</h1>
    <p>Where Style Meets Motion</p>
</div>

<!-- HEADER -->
<header>
<div class="logo">🔥 Evolution</div>
<nav>
<a href="#home">Home</a>
<a href="#products">Products</a>
<a href="#contact">Contact</a>
</nav>
</header>

<!-- HERO -->
<section class="hero" id="home">
    <h2>Evolution</h2>
    <p>Where Style Meets Motion</p>
    <button class="btn" onclick="alert('Welcome to Evolution')">Explore</button>
</section>

<!-- PRODUCTS -->
<section class="section" id="products">
<h2>Collections</h2>

<div class="cards">
<div class="card" onclick="openModal('footwear')">Footwear</div>
<div class="card" onclick="openModal('apparel')">Apparel</div>
<div class="card" onclick="openModal('limited')">Limited</div>
</div>
</section>

<!-- MODALS -->
<div class="modal" id="footwear">
<div class="modal-box">
<h3>Footwear</h3>
<img src="ChatGPT Image Apr 5, 2026, 05_29_44 PM.png" width="300">
</div>
</div>

<div class="modal" id="apparel">
<div class="modal-box">
<h3>Apparel</h3>
<img src="ChatGPT Image Apr 5, 2026, 05_30_08 PM.png" width="300">
</div>
</div>

<div class="modal" id="limited">
<div class="modal-box">
<h3>Limited Edition</h3>
<img src="limited-edition-tracksuit.png" width="300">
</div>
</div>

<!-- FOOTER -->
<footer>
© 2026 Evolution — Where Style Meets Motion
</footer>

<script>
// intro fade
setTimeout(()=>{
    document.getElementById("intro").style.display="none";
}, 3000);

// modals
function openModal(id){
    document.getElementById(id).classList.add("active");
}

document.querySelectorAll(".modal").forEach(m=>{
    m.onclick = e=>{
        if(e.target===m) m.classList.remove("active");
    }
});
</script>

</body>
</html>
