<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolution - Premium Shoes & Clothing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #f5f5f5;
            background-color: #000000;
        }

        header {
            background: linear-gradient(135deg, #b30000 0%, #000000 100%);
            color: white;
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.25);
        }

        nav a {
            color: white;
        }

        .logo {
            color: white;
        }

        .visitor-counter {
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: white;
        }

        .visitor-counter:hover {
            background: rgba(255, 0, 0, 0.25);
        }

        .counter-badge {
            background: #b30000;
            color: white;
        }

        .hero {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(255, 0, 0, 0.25)),
            url('ChatGPT Image Apr 5, 2026, 05_30_31 PM.png');
        }

        .cta-button.primary {
            background: #b30000;
            color: white;
        }

        .cta-button.primary:hover {
            box-shadow: 0 12px 30px rgba(255, 0, 0, 0.35);
        }

        .cta-button.secondary {
            background: rgba(255, 0, 0, 0.15);
            border: 2px solid #b30000;
            color: white;
        }

        .section h2 {
            color: #ffffff;
        }

        .section-subtitle {
            color: #cccccc;
        }

        .feature-card {
            background: #111111;
            border: 1px solid #2a2a2a;
            color: white;
        }

        .feature-card h3 {
            color: #ff1a1a;
        }

        .feature-card p {
            color: #cccccc;
        }

        .status-banner {
            background: linear-gradient(135deg, #1a0000 0%, #000000 100%);
            border-left: 5px solid #b30000;
        }

        .status-banner p {
            color: #ff4d4d;
        }

        .gallery-preview-item {
            background: #111111;
            border: 1px solid #2a2a2a;
            color: white;
        }

        .gallery-preview-item strong {
            color: #ffffff;
        }

        .gallery-preview-item p {
            color: #cccccc;
        }

        footer {
            background: #000000;
            color: #cccccc;
            border-top: 1px solid #2a2a2a;
        }

        .modal-content {
            background-color: #111111;
            color: white;
        }

        .modal-header h2 {
            color: #ff1a1a;
        }

        .close-btn {
            color: #cccccc;
        }

        .close-btn:hover {
            color: #ff1a1a;
        }

        .contact-form input {
            background: #111111;
            color: white;
            border: 2px solid #2a2a2a;
        }

        .contact-form input:focus {
            border-color: #b30000;
        }

        .contact-form button {
            background: linear-gradient(135deg, #b30000 0%, #000000 100%);
        }

        .form-notice {
            color: #aaaaaa;
        }

    </style>
</head>
