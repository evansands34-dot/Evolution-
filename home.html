<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evolution</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:#0a0a0a;
color:white;
}

/* INTRO */
#intro{
position:fixed;
inset:0;
background:linear-gradient(135deg,#000,#1a0000);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
animation:fadeOut 1s ease 2.5s forwards;
}

#intro h1{
font-size:42px;
color:#ff1a1a;
}

#intro p{
color:#aaa;
margin-top:10px;
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

/* HEADER */
header{
background:#000;
display:flex;
justify-content:space-between;
padding:20px;
border-bottom:2px solid #ff1a1a;
}

.logo{
color:#ff1a1a;
font-weight:bold;
font-size:20px;
}

nav a{
color:white;
margin-left:15px;
text-decoration:none;
}

/* HERO */
.hero{
height:80vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
background:
linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.7)),
url('ChatGPT Image Apr 5, 2026, 05_30_31 PM.png');
background-size:cover;
}

.hero h2{
font-size:50px;
color:#ff1a1a;
}

.btn{
margin-top:15px;
padding:12px 22px;
background:#ff1a1a;
border:none;
color:white;
cursor:pointer;
border-radius:8px;
}

/* SECTION */
.section{
padding:60px 20px;
text-align:center;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:20px;
}

.card{
background:#111;
padding:20px;
border:1px solid #ff1a1a;
border-radius:10px;
cursor:pointer;
}

/* MODAL */
.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
}

.modal.active{display:flex;}

.modal-box{
background:white;
color:black;
padding:20px;
border-radius:10px;
max-width:500px;
}

.modal-box img{
width:100%;
margin-top:10px;
border-radius:10px;
}

/* FOOTER */
footer{
background:#000;
text-align:center;
padding:20px;
border-top:2px solid #ff1a1a;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
<h1>Evolution</h1>
<p>Where Style Meets Motion</p>
</div>

<header>
<div class="logo">🔥 Evolution</div>
<nav>
<a href="#products">Products</a>
<a href="#contact">Contact</a>
</nav>
</header>

<section class="hero">
<h2>Evolution</h2>
<p>Where Style Meets Motion</p>
<button class="btn">Explore</button>
</section>

<section class="section" id="products">
<h2>Collections</h2>

<div class="cards">
<div class="card" onclick="openModal('footwear')">Footwear</div>
<div class="card" onclick="openModal('apparel')">Apparel</div>
<div class="card" onclick="openModal('limited')">Limited</div>
</div>
</section>

<!-- MODALS FIXED -->
<div class="modal" id="footwear">
<div class="modal-box">
<h3>Footwear</h3>
<img src="ChatGPT Image Apr 5, 2026, 05_29_44 PM.png">
</div>
</div>

<div class="modal" id="apparel">
<div class="modal-box">
<h3>Apparel</h3>
<img src="ChatGPT Image Apr 5, 2026, 05_30_08 PM.png">
<img src="ChatGPT Image Apr 5, 2026, 05_29_10 PM.png">
</div>
</div>

<div class="modal" id="limited">
<div class="modal-box">
<h3>Limited Edition</h3>
<img src="limited-edition-tracksuit.png">
</div>
</div>

<footer>
© 2026 Evolution — Where Style Meets Motion
</footer>

<script>
setTimeout(()=>{
document.getElementById("intro").style.display="none";
},2500);

function openModal(id){
document.getElementById(id).classList.add("active");
}

document.querySelectorAll(".modal").forEach(m=>{
m.onclick=e=>{
if(e.target===m) m.classList.remove("active");
}
});
</script>

</body>
</html>
